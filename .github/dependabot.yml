# Dependabot configuration — keeps npm + GitHub Actions versions current.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      # Group minor + patch updates so the inbox doesn't explode every Monday.
      # Majors still come as individual PRs (they need closer review).
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        update-types:
          - patch
          - minor
          - major
    ignore:
      # xlsx ships from a custom URL (https://cdn.sheetjs.com/...) and isn't
      # resolvable by the npm registry; Dependabot can't update it. We track
      # the replacement to exceljs separately as part of Phase 1 hardening.
      - dependency-name: xlsx
      # firebase major bumps require manual API audit (auth flow, RTDB shape).
      - dependency-name: firebase
        update-types: [version-update:semver-major]
      - dependency-name: firebase-admin
        update-types: [version-update:semver-major]
      # react/react-dom majors need a coordinated bump.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
