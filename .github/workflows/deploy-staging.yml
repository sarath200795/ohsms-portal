name: Deploy — Staging

# Multi-tenant architecture (each org runs its own Firebase project):
#  - The SPA bundle is generic — it ships with PLACEHOLDER firebase config.
#    Users land on the SPA, /setup (or the org picker) writes the real
#    per-org Firebase credentials to localStorage at runtime, and the page
#    reloads against that project. See src/config/firebase.js.
#  - Therefore CI MUST NOT bake real VITE_FIREBASE_* values — that would
#    lock every visitor to one org's Firebase project.
#  - FIREBASE_PROJECT_ID below refers to the project that HOSTS the static
#    SPA files (Firebase Hosting), NOT an org's data backend. It's singular.
#  - Database + Storage rules are NEVER deployed from staging — they go out
#    via deploy-production.yml only, after manual review on a signed tag.
#  - The `staging` channel auto-expires after 30 days unless re-deployed.

on:
  push:
    branches: [main, main-3dbme3]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build — ${{ matrix.target }}
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            script: build
            artifact: dist
          - target: fieldportal
            script: build:field-portal
            artifact: dist-field-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build ${{ matrix.target }}
        run: npm run ${{ matrix.script }}
        env:
          # Multi-tenant: ship placeholder Firebase config. Each org's real
          # credentials are written to localStorage at runtime via /setup.
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_DATABASE_URL: https://ci-placeholder-default-rtdb.firebaseio.com/
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
          # Bake a staging marker into the build so the UI can render a
          # "STAGING" banner when running on non-production channels.
          VITE_DEPLOY_ENV: staging
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}/
          retention-days: 7

  deploy:
    name: Deploy — ${{ matrix.target }} (channel: staging)
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            artifact: dist
          - target: fieldportal
            artifact: dist-field-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}/
      - name: Deploy to Hosting channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_STAGING }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          target: ${{ matrix.target }}
          channelId: staging
          expires: 30d
