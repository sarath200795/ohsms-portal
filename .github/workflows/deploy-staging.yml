name: Deploy — Staging

# Single-Firebase-project setup (per Phase 1 decision):
#  - Staging deploys to Hosting "channel" (named `staging`) on the same site,
#    giving a distinct URL without a separate Firebase project.
#  - Database + Storage rules are NEVER deployed from staging — they go out
#    via deploy-production.yml only, after manual review on a signed tag.
#  - The `staging` channel auto-expires after 30 days unless re-deployed.

on:
  push:
    branches: [main, main-3dbme3]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build — ${{ matrix.target }}
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            script: build
            artifact: dist
          - target: fieldportal
            script: build:field-portal
            artifact: dist-field-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build ${{ matrix.target }}
        run: npm run ${{ matrix.script }}
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_APP_CHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APP_CHECK_SITE_KEY }}
          # Bake a staging marker into the build so the UI can render a
          # "STAGING" banner when running on non-production channels.
          VITE_DEPLOY_ENV: staging
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}/
          retention-days: 7

  deploy:
    name: Deploy — ${{ matrix.target }} (channel: staging)
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            artifact: dist
          - target: fieldportal
            artifact: dist-field-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}/
      - name: Deploy to Hosting channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_STAGING }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          target: ${{ matrix.target }}
          channelId: staging
          expires: 30d
