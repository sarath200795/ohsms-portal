# Temporary: fetch openly-licensed photo candidates from Wikimedia Commons.
# Round 2 — exact file titles + category enumeration instead of fuzzy search.
name: fetch-photos
on:
  push:
    branches: [claude/21st-mcp-http-setup-5eh4w5]
    paths: ['.github/workflows/fetch-photos.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch candidates
        run: |
          set -euo pipefail
          rm -rf photo-candidates && mkdir -p photo-candidates
          UA="WE-EHS-launch-page/1.0 (contact: sarath200795@gmail.com)"
          API='https://commons.wikimedia.org/w/api.php'
          echo '[]' > photo-candidates/credits.json

          fetch_titles() { # subject, titles (| separated)
            local key="$1" titles="$2" i=0
            RESP=$(curl -sf -A "$UA" -G "$API" \
              --data-urlencode 'action=query' --data-urlencode 'format=json' \
              --data-urlencode "titles=$titles" \
              --data-urlencode 'prop=imageinfo' \
              --data-urlencode 'iiprop=url|extmetadata|size' --data-urlencode 'iiurlwidth=1600')
            for row in $(echo "$RESP" | jq -r '.query.pages | to_entries[] | .value | @base64'); do
              _get() { echo "$row" | base64 -d | jq -r "$1"; }
              THUMB=$(_get '.imageinfo[0].thumburl // empty'); [ -z "$THUMB" ] && continue
              W=$(_get '.imageinfo[0].width // 0'); [ "$W" -lt 700 ] && continue
              i=$((i+1))
              curl -sf -A "$UA" "$THUMB" -o "photo-candidates/$key-$i.jpg" || { i=$((i-1)); continue; }
              jq --arg f "$key-$i.jpg" --arg t "$(_get '.title')" --arg p "$(_get '.imageinfo[0].descriptionurl')" \
                 --arg l "$(_get '.imageinfo[0].extmetadata.LicenseShortName.value // "unknown"')" \
                 --arg a "$(_get '.imageinfo[0].extmetadata.Artist.value // "unknown"' | sed 's/<[^>]*>//g' | head -c 120)" \
                 '. += [{file:$f, title:$t, page:$p, license:$l, artist:$a}]' \
                 photo-candidates/credits.json > /tmp/c.json && mv /tmp/c.json photo-candidates/credits.json
            done
            echo "$key: $i files"
          }

          fetch_category() { # subject-prefix, category, limit
            local key="$1" cat="$2" limit="$3"
            TITLES=$(curl -sf -A "$UA" -G "$API" \
              --data-urlencode 'action=query' --data-urlencode 'format=json' \
              --data-urlencode 'list=categorymembers' \
              --data-urlencode "cmtitle=Category:$cat" \
              --data-urlencode 'cmtype=file' --data-urlencode 'cmlimit=40' |
              jq -r '.query.categorymembers[].title' | grep -iE '\.(jpe?g|png)$' | head -"$limit" | paste -sd'|')
            [ -n "$TITLES" ] && fetch_titles "$key" "$TITLES"
          }

          fetch_titles navyaudit 'File:US Navy 060621-N-0490C-001 Lt. Cmdr. David Fowler assigned to Nuclear Propulsion Mobile Training Team (NPMTT) conducts an administration inspection.jpg'
          fetch_titles navyhose 'File:US Navy 100511-N-2259P-019 Damage Controlman 1st Class Brian Clegg inspects a fire hose aboard USS John Paul Jones (DDG 53).jpg'
          fetch_titles navyhelmet 'File:US Navy 050126-N-7405P-100 Damage Controlman Fireman Andy Nutzhorn inspects a fire fighting helmet during his daily check of Repair Locker 1A aboard Nimitz-class aircraft carrier USS Harry S. Truman (CVN 75).jpg'
          ls -la photo-candidates
      - name: Commit candidates
        run: |
          git config user.name 'photo-fetch-bot'
          git config user.email 'actions@github.com'
          git add -A photo-candidates
          git commit -m 'chore: photo candidates round 3 [skip ci]'
          git push
