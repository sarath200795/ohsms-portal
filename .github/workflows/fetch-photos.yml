# Temporary: probe which Vercel secrets exist in this repo (presence only,
# values never printed), so the landing page can be deployed from CI.
name: fetch-photos
on:
  push:
    branches: [claude/21st-mcp-http-setup-5eh4w5]
    paths: ['.github/workflows/fetch-photos.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report secret presence
        env:
          T: ${{ secrets.VERCEL_TOKEN }}
          O: ${{ secrets.VERCEL_ORG_ID }}
          P: ${{ secrets.VERCEL_PROJECT_ID }}
          H: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          [ -n "$T" ] && echo "VERCEL_TOKEN: present" || echo "VERCEL_TOKEN: MISSING"
          [ -n "$O" ] && echo "VERCEL_ORG_ID: present" || echo "VERCEL_ORG_ID: MISSING"
          [ -n "$P" ] && echo "VERCEL_PROJECT_ID: present" || echo "VERCEL_PROJECT_ID: MISSING"
          [ -n "$H" ] && echo "VERCEL_DEPLOY_HOOK: present" || echo "VERCEL_DEPLOY_HOOK: MISSING"
