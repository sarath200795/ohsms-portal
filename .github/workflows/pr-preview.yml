name: PR Preview

# Builds both SPAs and deploys to ephemeral Firebase Hosting preview channels
# (`pr-<number>`). Channel URL is commented back on the PR by the action.
# Preview channels expire after 7 days unless re-deployed.
#
# Multi-tenant architecture: the SPA bundle ships with PLACEHOLDER firebase
# config — reviewers visiting the preview URL will land on the org picker
# (or /setup) and can point at any org's Firebase project. See
# src/config/firebase.js and the deploy-staging.yml header.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview — ${{ matrix.target }}
    runs-on: ubuntu-latest
    # PRs from forks don't get access to repo secrets — skip preview for them.
    # Maintainers can re-run after pulling the PR into a branch.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            script: build
            artifact: dist
          - target: fieldportal
            script: build:field-portal
            artifact: dist-field-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build ${{ matrix.target }}
        run: npm run ${{ matrix.script }}
        env:
          # Multi-tenant: ship placeholder Firebase config. Each org's real
          # credentials are written to localStorage at runtime via /setup.
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_DATABASE_URL: https://ci-placeholder-default-rtdb.firebaseio.com/
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
          VITE_DEPLOY_ENV: preview
      - name: Deploy preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_STAGING }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          target: ${{ matrix.target }}
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 7d
