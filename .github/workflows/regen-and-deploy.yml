name: Regen Lockfile + Deploy

# Two-in-one recovery workflow.
#
# Step 1 (always runs):
#   Regenerate package-lock.json from package.json on a clean checkout.
#   If the lockfile changed, commit + push it back to the branch. This is
#   the fix for the recurring 'Missing: @emnapi/core from lock file' CI
#   failure that lands every time a new dependency is added without
#   re-running npm install locally.
#
# Step 2 (only if FIREBASE_SERVICE_ACCOUNT secret is set):
#   Build both SPAs and deploy to Firebase Hosting (live channel) and
#   push database + storage rules. Skips silently if no secret is set —
#   the lockfile fix still lands.
#
# Trigger this via the Actions tab → 'Regen Lockfile + Deploy' → Run.

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'After regen, also deploy to Firebase Hosting + rules?'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write

concurrency:
  group: regen-and-deploy
  cancel-in-progress: false

jobs:
  regen:
    name: Regenerate package-lock.json
    runs-on: ubuntu-latest
    outputs:
      lockfile_changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --package-lock-only updates the lockfile without writing node_modules;
      # plenty for fixing sync errors. Allow optional deps so the @emnapi /
      # @rolldown wasm chain (introduced by @react-three/fiber + framer-motion
      # + three) lands in the lockfile.
      - name: npm install (lockfile only)
        run: npm install --package-lock-only --no-audit --no-fund
      - id: diff
        name: Detect lockfile change
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Lockfile already in sync — no commit needed."
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            echo "Lockfile drifted; will commit."
          fi
      - name: Commit + push lockfile
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): regenerate package-lock.json (CI auto-fix)"
          git push origin HEAD:${{ github.ref_name }}

  build:
    name: Build — ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: regen
    if: inputs.deploy == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            script: build
            artifact: dist
          - target: fieldportal
            script: build:field-portal
            artifact: dist-field-portal
    steps:
      # Re-checkout to pick up the lockfile commit the regen job just pushed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build ${{ matrix.target }}
        run: npm run ${{ matrix.script }}
        env:
          # Multi-tenant: SPA ships with placeholder Firebase config; each
          # org's real credentials are written to localStorage at runtime
          # via /setup. See src/config/firebase.js.
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_DATABASE_URL: https://ci-placeholder-default-rtdb.firebaseio.com/
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
          VITE_DEPLOY_ENV: production
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}/
          retention-days: 7

  deploy:
    name: Deploy — Hosting + Rules
    runs-on: ubuntu-latest
    needs: build
    if: inputs.deploy == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Detect deploy credential
        id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SA" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is not set."
            echo "Add it under Settings → Secrets and variables → Actions"
            echo "(value = the JSON of a Firebase service-account key with"
            echo " 'Firebase Hosting Admin' + 'Firebase Realtime Database Admin' roles)."
            echo "have_sa=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "have_sa=true" >> "$GITHUB_OUTPUT"
      - name: Download main app build
        if: steps.check.outputs.have_sa == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Download field-portal build
        if: steps.check.outputs.have_sa == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist-field-portal
          path: dist-field-portal/
      - name: Write service account
        if: steps.check.outputs.have_sa == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Deploy Hosting + Database + Storage rules
        if: steps.check.outputs.have_sa == 'true'
        env:
          # Project taken from .firebaserc default if not provided explicitly.
          FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          PROJECT_ARG=""
          if [ -n "$FIREBASE_PROJECT" ]; then
            PROJECT_ARG="--project $FIREBASE_PROJECT"
          fi
          npx --yes firebase-tools@latest deploy \
            --only hosting,database,storage \
            $PROJECT_ARG \
            --non-interactive
