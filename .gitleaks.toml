# Gitleaks configuration for ohsms-portal
# Extends the default gitleaks ruleset; only allowlists known false positives.
# https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml

[extend]
useDefault = true

[allowlist]
description = "Allowlist for known placeholders and committed public configuration"

# CI placeholder Firebase config in workflow files — these are not real secrets,
# they're literal strings used so Vite builds complete without credentials in CI.
regexes = [
  '''ci-placeholder''',
  '''0{12}''',
  '''0{22}''',
]

# Files that legitimately contain Firebase Web SDK config (publishable values,
# not credentials in the secret sense — Firebase Auth + RTDB rules are the
# real security boundary).
paths = [
  '''package-lock\.json''',
  '''\.github/workflows/.*\.yml''',
  '''src/config/firebase\.js''',
]
